# Runs on every PR into develop/qa/main and on every push to them.
# Branch protection requires the "build" job to pass before a PR can merge.
name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

# a newer push to the same branch/PR cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # throwaway Postgres for SpringdemoApplicationTests; destroyed when the job ends
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: springdemo_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/springdemo_ci
      DB_USERNAME: ci
      DB_PASSWORD: ci # not a secret: only valid for the container above

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 7
