# Shared defaults for ALL environments. Profile files (application-{dev,qa,prd}.yaml) override only what differs.
# Pick the environment with SPRING_PROFILES_ACTIVE=dev|qa|prd (env var) — same JAR everywhere.
spring:
  application:
    name: springdemo

  profiles:
    # local convenience: no profile set -> dev. Servers must always set SPRING_PROFILES_ACTIVE explicitly.
    default: dev

  # values come from environment variables (servers) or .env (dev only); never commit real secrets
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # keep DB access inside the service layer; lazy loading in controllers/JSON is a classic bug source
    open-in-view: false
    hibernate:
      # safe default: check entities match the schema, never change it
      ddl-auto: validate
    properties:
      hibernate:
        # loads lazy collections in batches instead of one query per row (avoids N+1)
        default_batch_fetch_size: 50

  data:
    web:
      pageable:
        max-page-size: 100

# third-party integrations: URLs/timeouts are config, never hardcoded in code
integration:
  exchange-rate:
    base-url: https://api.frankfurter.dev/v1
    connect-timeout: 2s
    read-timeout: 3s
